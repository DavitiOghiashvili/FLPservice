<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{appTitle}}</title>

  <script type="text/javascript">
    window["sap-ushell-config"] = {
      defaultRenderer: "fiori2",
      bootstrapPlugins: {
        "RuntimeAuthoringPlugin": {
          component: "sap.ushell.plugins.rta",
          config: {
            validateAppVersion: false
          }
        }
      },
      renderers: {
        fiori2: {
          componentData: {
            config: {
              search: "hidden",
              enableSearch: false
            }
          }
        }
      },
      applications: {
        "fiorielementsapp-display": {
          title: "Manage products",
          description: "Fiori App",
          additionalInformation: "SAPUI5.Component=fiorielementsapp",
          applicationType: "URL",
          url: "./fiori-elements-app/webapp"
        },
        "freestylesapui5app-display": {
          title: "Manage stores",
          description: "Freestyle App",
          additionalInformation: "SAPUI5.Component=freestylesapui5app",
          applicationType: "URL",
          url: "./free-style-sapui5-app/webapp"
        }
      },
      services: {
        LaunchPage: {
          adapter: {
            config: {
              groups: [
                {
                  id: "group1",
                  title: "My Apps, group 1",
                  tiles: [
                    {
                      id: "tile1",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        targetURL: "#fiorielementsapp-display"
                      }
                    },
                    {
                      id: "tile2",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        targetURL: "#freestylesapui5app-display"
                      }
                    }
                  ]
                },
                {
                  id: "group2",
                  title: "My Apps, group 2",
                  tiles: [
                    {
                      id: "tile3",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        targetURL: "#fiorielementsapp-display"
                      }
                    },
                    {
                      id: "tile4",
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        targetURL: "#freestylesapui5app-display"
                      }
                    }
                  ]
                }
              ]
            }
          }
        }
      }
    };
  </script>

  <script src="https://sapui5.hana.ondemand.com/1.136.2/test-resources/sap/ushell/bootstrap/sandbox.js"
    id="sap-ushell-bootstrap">
    </script>

  <script id="sap-ui-bootstrap" src="https://sapui5.hana.ondemand.com/1.136.2/resources/sap-ui-core.js"
    data-sap-ui-libs="sap.m,sap.ushell,sap.fe.templates" data-sap-ui-async="true" data-sap-ui-preload="async"
    data-sap-ui-theme="sap_horizon" data-sap-ui-compatVersion="edge" data-sap-ui-language="en"
    data-sap-ui-frameOptions="allow" data-sap-ui-resourceroots='{
      "fiorielementsapp": "./fiori-elements-app/webapp",
      "freestylesapui5app": "./free-style-sapui5-app/webapp"
    }' data-sap-ui-flexibilityServices='[{"connector": "LocalStorageConnector"}]'>
    </script>

  <script>
    sap.ui.getCore().attachInit(function () {
      sap.ushell.Container.createRenderer(true).then(function (renderer) {
        renderer.placeAt("content");
      });
    });
  </script>
</head>

<body class="sapUiBody" id="content"></body>

</html>
