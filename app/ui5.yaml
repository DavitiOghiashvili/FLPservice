specVersion: "3.1"
metadata:
  name: metadata
type: application

framework:
  name: SAPUI5
  version: "1.120.0" # match your SAPUI5 version
  libraries:
    - name: sap.m
    - name: sap.ushell
    - name: sap.ui.core
    - name: sap.fe.templates

resources:
  configuration:
    paths:
      webapp: app

server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: true
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://sapui5.hana.ondemand.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
